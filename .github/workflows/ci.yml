name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 pytest

      - name: Run flake8
        run: flake8 . --max-line-length=170 --extend-ignore=E203,W503

      - name: Run black --check
        run: black --check .

      - name: Run pytest (optional, will be enabled when tests appear)
        run: |
          if [ -d "tests" ]; then
            pytest
          else
            echo "No tests directory, skipping pytest."
          fi

