<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — StroyBase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-card { max-width: 420px; margin: auto; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.25); }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card card">
            <div class="card-header text-center text-white bg-dark py-4">
                <h1 class="display-5 fw-bold"><i class="bi bi-building-fill me-3"></i>StroyBase</h1>
                <p class="opacity-75 mb-0">Цифровая база ПТО</p>
            </div>
            <div class="card-body p-5">
                <form method="POST">
                    {{ form.hidden_tag() }}
                    <div class="mb-4">
                        {{ form.login.label(class="form-label fw-bold") }}
                        {{ form.login(class="form-control form-control-lg") }}
                    </div>
                    <div class="mb-4">
                        {{ form.password.label(class="form-label fw-bold") }}
                        {{ form.password(class="form-control form-control-lg") }}
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-bold">Войти в систему</button>
                </form>
            </div>
            <div class="card-footer text-center py-4 bg-light">
                <small class="text-muted">Первый вход — <strong>admin / admin</strong></small>
            </div>
        </div>
    </div>
</body>
</html>
