<!-- StroyBase: floors/plan_embed.html — компактный вид плана для встраивания в iframe -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>План этажа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #f8f9fa;
        }
        .plan-embed-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .plan-embed-image {
            max-width: 100%;
            max-height: 100%;
            height: auto;
            width: auto;
            display: block;
        }
        .plan-embed-marker {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #0d6efd;
            background: rgba(13, 110, 253, 0.45);
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div class="plan-embed-container">
        {% if plan.image_path %}
            <img src="{{ url_for('static', filename=plan.image_path) }}"
                 alt="{{ plan.custom_name or 'План' }}"
                 class="plan-embed-image" id="planEmbedImage">
            {% if show_marks %}
                {% for m in marks %}
                    {% if m.x is not none and m.y is not none and (not only_mark_id or m.id == only_mark_id) %}
                    <div class="plan-embed-marker"
                         style="left: {{ (m.x * 100 if m.x <= 1 else m.x) }}%; top: {{ (m.y * 100 if m.y <= 1 else m.y) }}%;"
                         title="Маркер #{{ m.id }}{% if m.note %} — {{ m.note }}{% endif %}">
                    </div>
                    {% endif %}
                {% endfor %}
            {% endif %}
        {% else %}
        <div class="text-center text-muted p-3">
            План не найден
        </div>
        {% endif %}
    </div>
</body>
</html>
